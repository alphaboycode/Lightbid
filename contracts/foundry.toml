[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
botchain = "https://rpc.bohr.life"
botchain_mainnet = "https://rpc.botchain.ai"

[etherscan]
botchain = { key = "none", url = "https://scan.bohr.life/api" }
botchain_mainnet = { key = "none", url = "https://scan.botchain.ai/api" }
